name: HermesPocket
options:
  bundleIdPrefix: com.wydrox
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "27.0"
  developmentLanguage: en
  xcodeVersion: "27.2"
  minimumXcodeGenVersion: "2.46.0"
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Version.xcconfig
  Release: Config/Version.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CLANG_ENABLE_MODULES: YES
    DEVELOPMENT_TEAM: 7S3F9767BM
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    IPHONEOS_DEPLOYMENT_TARGET: "27.0"
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
targets:
  HermesPocket:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
        excludes:
          - generate-app-icon.py
    settings:
      base:
        PRODUCT_NAME: HermesPocket
        PRODUCT_BUNDLE_IDENTIFIER: com.wydrox.hocket
        INFOPLIST_FILE: Config/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
  HermesPocketTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/HermesPocketTests
    dependencies:
      - target: HermesPocket
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wydrox.hocket.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/HermesPocket.app/HermesPocket"
        BUNDLE_LOADER: "$(TEST_HOST)"
  HermesPocketUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests/HermesPocketUITests
    dependencies:
      - target: HermesPocket
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wydrox.hocket.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_TARGET_NAME: HermesPocket
schemes:
  HermesPocket:
    build:
      targets:
        HermesPocket: all
        HermesPocketTests: [test]
        HermesPocketUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: HermesPocketTests
          parallelizable: false
          randomExecutionOrder: true
        - name: HermesPocketUITests
          parallelizable: false
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
      revealArchiveInOrganizer: true
