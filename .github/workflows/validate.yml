name: Validate iOS

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Native tests and onboarding · iOS simulator
    runs-on: xcode-27
    timeout-minutes: 20
    strategy:
      max-parallel: 1
    steps:
      - name: Check out the requested commit
        uses: actions/checkout@v7.0.1

      - name: Select an installed stable Xcode 27 toolchain
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os
          from pathlib import Path
          import plistlib
          import re

          candidates = []
          for app in Path('/Applications').glob('Xcode*.app'):
              if any(word in app.name.lower() for word in ('beta', 'candidate')):
                  continue
              info_path = app / 'Contents/Info.plist'
              if not info_path.is_file():
                  continue
              with info_path.open('rb') as stream:
                  version = str(plistlib.load(stream).get('CFBundleShortVersionString', ''))
              if re.fullmatch(r'27(?:\.\d+){0,2}', version):
                  numeric = tuple(int(part) for part in version.split('.'))
                  candidates.append((numeric, app.resolve()))
          if not candidates:
              raise SystemExit('Required stable Xcode 27.x is absent. Select a compatible standard runner; no toolchain will be downloaded.')
          _, selected = max(candidates)
          developer = selected / 'Contents/Developer'
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write(f'DEVELOPER_DIR={developer}\n')
          print(f'Selected {selected}')
          PY

      - name: Validate project inputs and print the toolchain
        shell: bash
        run: |
          set -euo pipefail
          ./ci_scripts/ci_post_clone.sh
          xcrun swift --version
          xcodebuild -showsdks

      - name: Select one available iPhone simulator running iOS 27 or later
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available --json > "$RUNNER_TEMP/hermes-simulators.json"
          python3 <<'PY'
          import json
          import os
          from pathlib import Path
          import re

          devices = json.loads((Path(os.environ['RUNNER_TEMP']) / 'hermes-simulators.json').read_text())['devices']
          candidates = []
          for runtime, entries in devices.items():
              match = re.search(r'\.iOS-(\d+)-(\d+)(?:-(\d+))?$', runtime)
              if not match:
                  continue
              version = tuple(int(part or 0) for part in match.groups())
              if version[0] < 27:
                  continue
              for device in entries:
                  if device.get('isAvailable') and device['name'].startswith('iPhone'):
                      candidates.append((version, device['name'], device['udid']))
          if not candidates:
              raise SystemExit('No available iPhone simulator with iOS 27+ exists on the selected toolchain.')
          version, name, identifier = max(candidates)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write(f'destination=platform=iOS Simulator,id={identifier}\n')
          print(f'Selected {name}, iOS {".".join(map(str, version))}, {identifier}')
          PY

      - name: Build and run the committed unit tests
        shell: bash
        env:
          TEST_DESTINATION: ${{ steps.simulator.outputs.destination }}
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild test \
            -project HermesPocket.xcodeproj \
            -scheme HermesPocket \
            -configuration Debug \
            -destination "$TEST_DESTINATION" \
            -destination-timeout 120 \
            -parallel-testing-enabled NO \
            -maximum-concurrent-test-simulator-destinations 1 \
            -resultBundlePath build/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee build/xcodebuild-test.log

      - name: Export native screenshots
        if: always()
        shell: bash
        run: |
          if [[ -d build/TestResults.xcresult ]]; then
            xcrun xcresulttool export attachments \
              --path build/TestResults.xcresult \
              --output-path build/Screenshots
          fi

      - name: Upload simulator test evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: hermes-pocket-tests-${{ github.run_id }}
          path: |
            build/TestResults.xcresult
            build/xcodebuild-test.log
            build/Screenshots
          if-no-files-found: warn
          retention-days: 7
